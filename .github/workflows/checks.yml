# Checks of the NASTRA branch (see PATCHES.md): upstream's tests on four platforms with
# and without rayon, the minimum Rust version, formatting and clippy against upstream,
# damaged streams in a release build with overflow checks, and libFLAC and ffmpeg
# decoding what the encoder writes.
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1" # weekly: new Rust releases and new upstream commits

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  UPSTREAM_BASE: a7b1ffb2037e268f118247f9d1546336a4cf13e3 # upstream release 1.3.3

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --check
      - name: clippy, no warnings beyond upstream 1.3.3
        run: |
          # JSON, because cargo replays cached warnings in the format they were first
          # rendered in
          count() {
            cargo clippy --all-targets --features rayon --message-format json > "$RUNNER_TEMP/clippy.json" || exit 1
            jq -s '[.[] | select(.reason == "compiler-message" and .message.level == "warning"
              and (.message.spans | length) > 0)] | length' "$RUNNER_TEMP/clippy.json"
          }
          here=$(count)
          git worktree add -q ../upstream "$UPSTREAM_BASE"
          base=$(cd ../upstream && count)
          echo "clippy warnings: $here on this branch, $base on upstream 1.3.3"
          test "$here" -le "$base"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
        features: ["", "--features rayon"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test ${{ matrix.features }}

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: test on the rust-version from Cargo.toml
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" test --features rayon

  hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
      CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
      HARDENING_ROUNDS: "1000000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test --release --test hardening

  reference-decoders:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends flac ffmpeg
      - run: flac --version && ffmpeg -version | head -1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test --release --test hardening reference_decoders_agree -- --ignored --nocapture

  upstream-drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: new upstream commits after 1.3.3
        run: |
          git fetch --no-tags -q https://github.com/tuffy/flac-codec.git master
          new=$(git rev-list --count "$UPSTREAM_BASE..FETCH_HEAD")
          echo "upstream master $(git rev-parse --short FETCH_HEAD): $new commits after 1.3.3"
          git log --oneline "$UPSTREAM_BASE..FETCH_HEAD"
          if [ "$new" -gt 0 ]; then
            echo "::warning::tuffy/flac-codec has $new commits after 1.3.3; check PATCHES.md"
          fi
